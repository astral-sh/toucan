[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/astral-sh/toucan"

[workspace.dependencies]
anyhow = "1.0.100"
char_str = "0.0.4"
clap = { version = "4.5", features = ["derive"] }
lang-c = { package = "toucan_parser", version = "0.0.1", path = "crates/toucan_parser" }
repc = { package = "toucan_layout", version = "0.0.1", path = "crates/toucan_layout" }
rustc-hash = "2.1.3"
rustc_apfloat = "0.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.16.0", features = ["union"] }
thiserror = "2.0"
thin-vec = "0.2.19"
tempfile = "3.23"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
lto = false

