[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/astral-sh/toucan"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
codspeed-criterion-compat = { version = "5.0.0", default-features = false }
criterion = { version = "0.8.0", default-features = false }
lang-c = { package = "toucan_parser", version = "0.0.1", path = "crates/toucan_parser" }
repc = { package = "toucan_layout", version = "0.0.1", path = "crates/toucan_layout" }
rustc_apfloat = "0.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.23"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(codspeed)'] }

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dist]
inherits = "release"

[profile.profiling]
inherits = "release"
debug = true
lto = false

