[package]
name = "toucan-inprocess-benchmark"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[features]
allocator-jemalloc = ["dep:tikv-jemallocator"]
allocator-mimalloc = ["dep:mimalloc"]

[dependencies]
bindgen = "=0.72.1"
mimalloc = { version = "0.1", features = ["v2"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toucan = { path = "../../crates/toucan" }
toucan_bindgen = { path = "../../crates/toucan_bindgen" }

[target.'cfg(all(unix, not(target_os = "openbsd")))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[lints.rust]
unsafe_code = "forbid"
