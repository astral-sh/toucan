name: CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - name: Select native C compiler oracles
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            if ! brew list --versions gcc@14 >/dev/null; then
              brew install gcc@14
            fi
            native_gcc="$(brew --prefix gcc@14)/bin/gcc-14"
          else
            native_gcc="$(command -v gcc)"
          fi
          native_gcc_version="$("$native_gcc" --version)"
          if [[ "$native_gcc_version" != *"Free Software Foundation"* ]]; then
            echo "Expected GNU GCC: $native_gcc_version" >&2
            exit 1
          fi
          echo "$native_gcc_version"
          clang --version
          if [[ "$(clang --version)" == *"Apple clang version 17.0.0 (clang-1700.0.13.5)"* ]]; then
            # This Apple build crashes on atomic pointer casts. Keep it for the
            # other oracles; use upstream Clang for those exact source cases.
            if ! brew list --versions llvm@18 >/dev/null; then
              brew install llvm@18
            fi
            atomic_pointer_clang="$(brew --prefix llvm@18)/bin/clang"
            "$atomic_pointer_clang" --version
            echo "TOUCAN_ATOMIC_POINTER_CLANG=$atomic_pointer_clang" >> "$GITHUB_ENV"
          fi
          echo "TOUCAN_GCC=$native_gcc" >> "$GITHUB_ENV"
          # Existing probes that invoke `gcc` must also use GNU GCC on macOS.
          oracle_bin="$RUNNER_TEMP/toucan-c-oracles"
          mkdir -p "$oracle_bin"
          ln -s "$native_gcc" "$oracle_bin/gcc"
          echo "$oracle_bin" >> "$GITHUB_PATH"
      - name: Check native parameter-entry oracles
        run: cargo test -p toucan_semantic --test old_style_definitions -- --include-ignored
      - run: cargo test --workspace --no-fail-fast -- --include-ignored
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: Rust 1.96
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.96'
      - run: cargo check --workspace --all-targets

  distribution:
    name: Packages and allocators (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - run: cargo test --workspace --all-features --locked
      - run: cargo package --workspace --all-features --locked
