name: Upstream corpus

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "corpus/manifest.json"
      - "corpus/probes.json"
      - "corpus/ffi/**"
      - "corpus/oracles/**"
      - "scripts/prepare_corpus.py"
      - "scripts/verify_corpus.py"
      - "scripts/compare_bindings.py"
      - "scripts/verify_equivalence.py"
      - "scripts/probe_record_layouts.py"
      - "tools/binding_compare/**"
      - ".github/workflows/corpus.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native corpus (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.96.0"

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends cmake tcl
          else
            if ! command -v cmake >/dev/null; then
              brew install cmake
            fi
            if ! command -v tclsh >/dev/null; then
              brew install tcl-tk
              echo "$(brew --prefix tcl-tk)/bin" >> "$GITHUB_PATH"
            fi
          fi

      - name: Select Python 3.12 or newer
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import sys; raise SystemExit(sys.version_info < (3, 12))'; then
            corpus_python="$(command -v python3)"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install python@3.12
            corpus_python="$(brew --prefix python@3.12)/bin/python3.12"
          else
            sudo apt-get install --yes --no-install-recommends python3.12
            corpus_python="$(command -v python3.12)"
          fi
          "$corpus_python" --version
          echo "CORPUS_PYTHON=$corpus_python" >> "$GITHUB_ENV"

      - name: Build the release frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus/cache/logs/frontend
          cargo build --locked --release -p toucan_cli --no-default-features 2>&1 | tee corpus/cache/logs/frontend/build.log

      - name: Prepare the four pinned libraries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$CORPUS_PYTHON" scripts/prepare_corpus.py --cache corpus/cache --gh gh --jobs 2 --workers 2

      - name: Run native C and Rust probes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            corpus_sysroot="$(xcrun --show-sdk-path)"
          else
            corpus_sysroot=/
          fi
          "$CORPUS_PYTHON" scripts/verify_corpus.py \
            --cache corpus/cache \
            --toucan target/release/toucan \
            --target '${{ matrix.target }}' \
            --sysroot "$corpus_sysroot" \
            --output corpus/results/native

      - name: Install the reference frontend
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install --yes --no-install-recommends libclang-18-dev
            export LIBCLANG_PATH=/usr/lib/llvm-18/lib
          else
            corpus_clang="$(xcrun --find clang)"
            export LIBCLANG_PATH="$(cd "$(dirname "$corpus_clang")/../lib" && pwd)"
          fi
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          cargo install bindgen-cli --version 0.72.1 --locked

      - name: Build and test the API comparison tool
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path tools/binding_compare/Cargo.toml
          cargo test --locked --manifest-path tools/binding_compare/Cargo.toml
          "$CORPUS_PYTHON" -m unittest discover -s tools/binding_compare/tests

      - name: Compare APIs and all complete C record layouts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            corpus_sysroot="$(xcrun --show-sdk-path)"
          else
            corpus_sysroot=/
          fi
          "$CORPUS_PYTHON" scripts/verify_equivalence.py \
            --prepared corpus/cache/prepared.json \
            --toucan target/release/toucan \
            --bindgen "$(command -v bindgen)" \
            --analyzer tools/binding_compare/target/release/toucan-binding-compare \
            --c-evidence corpus/results/native/evidence.json \
            --target '${{ matrix.target }}' \
            --sysroot "$corpus_sysroot" \
            --output corpus/results/equivalence
          "$CORPUS_PYTHON" scripts/probe_record_layouts.py \
            --prepared corpus/cache/prepared.json \
            --inventory-dir corpus/results/equivalence \
            --bindings-dir corpus/results/equivalence \
            --target '${{ matrix.target }}' \
            --sysroot "$corpus_sysroot" \
            --output corpus/results/record-layouts

      - name: Upload native evidence and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corpus-${{ matrix.target }}
          path: |
            corpus/results/**/*.json
            corpus/results/**/*.stdout
            corpus/results/**/*.stderr
            corpus/results/**/*.rs
            corpus/results/**/*.c
            corpus/cache/prepared.json
            corpus/cache/logs/
          if-no-files-found: error
          retention-days: 14
