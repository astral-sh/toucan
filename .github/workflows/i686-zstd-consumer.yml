name: i686 zstd Rust consumer

on:
  push:
    branches:
      - charlie/codex-toucan-i686-zstd-consumer-acceptance

permissions:
  contents: read

concurrency:
  group: i686-zstd-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ELF32 zstd C/Rust consumer
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install i686 C and Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/i686-zstd
          git rev-parse HEAD | tee results/i686-zstd/commit.txt
          uname -a | tee results/i686-zstd/runner.txt
          python3 -c 'import sys; raise SystemExit(sys.version_info < (3, 12))'
          sudo apt-get update -qq 2>&1 | tee results/i686-zstd/apt-update.log
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386 clang binutils 2>&1 | tee results/i686-zstd/apt-install.log
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      - name: Build the host frontend
        shell: bash
        run: |
          set -euo pipefail
          rustup target list --installed | tee results/i686-zstd/rust-targets.txt
          grep -Fx i686-unknown-linux-gnu results/i686-zstd/rust-targets.txt
          cargo build --locked --release -p toucan_cli --no-default-features 2>&1 | tee results/i686-zstd/frontend-build.log
      - name: Execute baseline and Toucan C/Rust i686 consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_zstd_consumer.py \
            --toucan target/release/toucan \
            --target i686-unknown-linux-gnu --native-i686 --sysroot / \
            --profile default \
            --cache corpus/cache/i686-zstd-consumer \
            --output results/i686-zstd/acceptance \
            2>&1 | tee results/i686-zstd/acceptance.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/i686-zstd/acceptance/evidence.json").read_text())
          assert result["status"] == "passed" and result["target"] == "i686-unknown-linux-gnu"
          assert result["profile"] == "default"
          assert len(result["native_i686_elf"]) == 5
          assert set(result["native_i686_c_archives"]) == {"upstream-zstd-c", "generated-zstd-c"}
          assert result["changed_upstream_files"] == ["src/bindings_zdict.rs", "src/bindings_zstd.rs"]
          assert result["consumed_bindings"] and result["identical_runtime_artifacts"]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: i686-zstd-consumer-${{ github.run_attempt }}
          path: results/i686-zstd/
          retention-days: 14
          if-no-files-found: error
