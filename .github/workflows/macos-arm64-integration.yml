name: Apple Silicon integration validation

# The general macOS workflow is not registered until it reaches the default
# branch. Run one explicit integration branch through the same reusable jobs.
on:
  push:
    branches: [charlie/codex-toucan-macos-arm64-validation]

permissions:
  contents: read

concurrency:
  group: macos-arm64-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    with:
      macos: true
      intel: false

  corpus:
    needs: tests
    uses: ./.github/workflows/corpus.yml
    with:
      macos: true
      intel: false
