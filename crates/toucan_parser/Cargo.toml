[package]
name = "toucan_parser"
version.workspace = true
edition = "2015"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["Vickenty Fesunov <kent@setattr.net>"]
description = "Handwritten C parser used by Toucan"
include = ["/src/**/*.rs", "/reftests/*.c", "/tests/**/*.rs", "/Cargo.toml", "/LICENSE*", "/README.md", "/UPSTREAM.md"]

[dependencies]
rustc-hash.workspace = true
toucan_stack = { version = "0.0.1", path = "../toucan_stack" }

[lints.rust]
unsafe_code = "forbid"
