[package]
name = "toucan_cli"
default-run = "toucan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line C header analysis and Rust binding generation"

[[bin]]
name = "toucan"
path = "src/main.rs"
doc = false

[[bin]]
name = "bindgen"
path = "src/bindgen.rs"
doc = false

[features]
default = ["performance-allocator"]
performance-allocator = ["dep:tikv-jemallocator", "dep:mimalloc"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toucan = { version = "0.0.1", path = "../toucan" }
toucan_bindgen = { version = "0.0.1", path = "../toucan_bindgen" }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "freebsd"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64")))'.dependencies]
tikv-jemallocator = { version = "0.6.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { version = "0.1.50", features = ["v2"], optional = true }

[lints]
workspace = true
