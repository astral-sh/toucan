[workspace]
members = ["cargo:."]

[dist]
# Release only packages that explicitly opt in.
dist = false
cargo-dist-version = "0.32.0"
precise-builds = true
ci = "github"
# Preserve PR path filters unsupported by cargo-dist 0.32; see docs/development.md.
allow-dirty = ["ci"]
# Manually dispatched releases, with artifact builds on relevant PRs.
dispatch-releases = true
github-release = "announce"
pr-run-mode = "upload"
installers = ["shell", "powershell"]
unix-archive = ".tar.gz"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]

[dist.github-custom-runners]
# Cross-compile Intel macOS binaries on Apple Silicon.
aarch64-apple-darwin = { runner = "macos-15", host = "aarch64-apple-darwin" }
x86_64-apple-darwin = { runner = "macos-15", host = "aarch64-apple-darwin" }
aarch64-unknown-linux-gnu = { runner = "ubuntu-22.04-arm", host = "aarch64-unknown-linux-gnu" }
aarch64-pc-windows-msvc = { runner = "windows-2022", host = "x86_64-pc-windows-msvc" }

[dist.github-action-commits]
"actions/checkout" = "de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"swatinem/rust-cache" = "c19371144df3bb44fab255c43d04cbc2ab54d1c4" # v2.9.1
